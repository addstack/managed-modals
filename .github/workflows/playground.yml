name: Playground

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "playground/**"
      - "package-lock.json"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

# One deployment at a time; never cancel one that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:playground
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist
      - id: deployment
        uses: actions/deploy-pages@v5
